<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F1E9" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wynd" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-dark-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/favicon-dark-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" href="/favicon-dark-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="/favicon-light-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)" href="/favicon-light-16.png" />

    <title>Wynd</title>
    <script>
      (function () {
        var resolved = 'light';
        try {
          var mode = localStorage.getItem('wynd_theme_mode');
          if (!mode) {
            var legacy = localStorage.getItem('fluxo_ui_preferences');
            if (legacy) {
              var parsed = JSON.parse(legacy);
              if (parsed && parsed.state && parsed.state.themeMode) {
                mode = parsed.state.themeMode;
              } else if (parsed && parsed.state && parsed.state.theme) {
                mode = parsed.state.theme;
              }
            }
          }
          if (mode === 'dark' || mode === 'light') {
            resolved = mode;
          } else {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) {
          resolved = 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', resolved === 'dark' ? '#0A1110' : '#F3F1E9');
        }
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
