<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamentos — FLUXO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/transactions.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>FLUXO</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
                <a href="transactions.html" class="nav-item active">
                    <i class="fa-solid fa-money-bill-transfer"></i> Lançamentos
                </a>
                <a href="cards.html" class="nav-item">
                    <i class="fa-solid fa-credit-card"></i> Cartões
                </a>
                <a href="accounts.html" class="nav-item">
                    <i class="fa-solid fa-wallet"></i> Contas & Perfis
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i> Relatórios
                </a>
                <a href="users.html" class="nav-item" id="navUsers" data-requires-role="admin">
                    <i class="fa-solid fa-users"></i> Usuários
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">Todos os Lançamentos</div>
                <div class="header-actions">
                    <button id="themeToggle" class="btn-icon">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    
                    <div class="user-profile-dropdown" style="position: relative;">
                        <div class="user-profile" id="userProfileBtn">
                            <div class="user-info">
                                <div class="user-name" id="userName">Usuário</div>
                                <div class="user-role" id="userRoleTitle">Administrador</div>
                            </div>
                            <img src="" alt="Avatar" class="user-avatar" id="userAvatar">
                        </div>
                        <div class="dropdown-menu glass-panel" id="userDropdown">
                            <a href="#profile" class="dropdown-item" id="myProfileLink"><i class="fa-solid fa-user"></i> Meu Perfil</a>
                            <a href="#" id="logoutBtn" class="dropdown-item"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-container">
                
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <h2 class="section-title">Gerenciar Lançamentos</h2>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn btn-danger" id="btnDeleteAllTransactions" style="background: var(--danger); color: white;"><i class="fa-solid fa-trash"></i> Excluir Tudo</button>
                        <button class="btn btn-primary" id="btnNovaTransacao"><i class="fa-solid fa-plus"></i> Nova Transação</button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters-section">
                    <div class="filter-group">
                        <label class="filter-label">Buscar</label>
                        <input type="text" class="filter-input" id="searchFilter" placeholder="Pesquise por descrição...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Tipo</label>
                        <select class="filter-input" id="typeFilter">
                            <option value="all">Todos</option>
                            <option value="income">Receitas</option>
                            <option value="expense">Despesas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Categoria</label>
                        <select class="filter-input" id="categoryFilter">
                            <option value="all">Todas as Categorias</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Educação">Educação</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Salário">Salário</option>
                            <option value="Investimentos">Investimentos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="filter-group" style="flex: 0; min-width: auto;">
                        <button class="btn btn-primary" id="btnFilter" style="padding: 0.75rem 1.5rem; height: 100%;">Filtrar</button>
                    </div>
                </div>

                <!-- Table -->
                <div class="transactions-table-container">
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Conta/Cartão</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th style="text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody">
                            <!-- Inserido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nova Transação -->
    <div class="modal-overlay" id="txModal">
        <div class="modal-content glass-panel" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 2rem; border-radius: var(--radius-lg); position: relative;">
            <div class="modal-header">
                <h3 class="modal-title">Novo Lançamento</h3>
                <button class="modal-close" id="closeTxModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="txForm">
                <div class="form-group">
                    <label class="form-label">Tipo</label>
                    <select class="form-control" id="txType" required>
                        <option value="expense">Despesa</option>
                        <option value="income">Receita</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="txDescription" required placeholder="Ex: Mercado, Salário...">
                </div>
                <div class="form-group">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" class="form-control" id="txAmount" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <select class="form-control" id="txCategory" required>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Educação">Educação</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Salário">Salário</option>
                        <option value="Investimentos">Investimentos</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Forma de Pagamento / Conta</label>
                    <select class="form-control" id="txPaymentMethod" required>
                        <!-- Preenchido via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Condição de Pagamento</label>
                    <select class="form-control" id="txPaymentMode">
                        <option value="single">À Vista (1x)</option>
                        <option value="installments">Parcelado</option>
                    </select>
                </div>
                <div class="form-group" id="txInstallmentsGroup" style="display: none; background: rgba(255,255,255,0.03); padding: 0.85rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 120px;">
                            <label class="form-label" style="font-size: 0.8rem;">Qtd. Parcelas</label>
                            <select class="form-control" id="txInstallmentsCount">
                                <option value="2">2x</option>
                                <option value="3">3x</option>
                                <option value="4">4x</option>
                                <option value="5">5x</option>
                                <option value="6">6x</option>
                                <option value="7">7x</option>
                                <option value="8">8x</option>
                                <option value="9">9x</option>
                                <option value="10">10x</option>
                                <option value="11">11x</option>
                                <option value="12">12x</option>
                                <option value="18">18x</option>
                                <option value="24">24x</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 140px;">
                            <label class="form-label" style="font-size: 0.8rem;">Cálculo do Valor</label>
                            <select class="form-control" id="txInstallmentValueType">
                                <option value="total">Valor Total da Compra</option>
                                <option value="monthly">Valor de Cada Parcela</option>
                            </select>
                        </div>
                    </div>
                    <div id="txInstallmentPreview" style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--accent-primary); font-weight: 700;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Pessoa</label>
                    <select class="form-control" id="txPerson" required>
                        <!-- Preenchido via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" class="form-control" id="txDate" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" id="cancelTxBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Configurações / Edição de Perfil do Usuário Logado -->
    <div class="modal-overlay" id="myProfileModal">
        <div class="modal-content glass-panel" style="width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 2rem; border-radius: var(--radius-lg); position: relative;">
            <button class="modal-close" onclick="window.UI.closeModal('myProfileModal')" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem;">
                <i class="fa-solid fa-times"></i>
            </button>
            <h2 class="modal-title" style="margin-bottom: 1.5rem;"><i class="fa-solid fa-user-gear" style="color: var(--accent-primary); margin-right: 0.5rem;"></i> Meu Perfil & Configurações</h2>
            
            <form id="myProfileForm">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                    <img src="" id="myProfileAvatarPreview" alt="Avatar" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary);">
                    <div>
                        <h3 id="myProfileNameHeader" style="margin: 0; font-size: 1.1rem;">Usuário</h3>
                        <span id="myProfileRoleBadge" style="font-size: 0.75rem; color: var(--accent-primary); background: rgba(99,102,241,0.1); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600;">Administrador</span>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="myProfileNameInput" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Nome de Usuário (Login)</label>
                        <input type="text" class="form-control" id="myProfileUsernameInput" required>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-control" id="myProfileCpfInput" placeholder="Apenas números">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="myProfileEmailInput">
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Pessoa Vinculada</label>
                        <input type="text" class="form-control" id="myProfilePersonInput" readonly style="opacity: 0.7;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">URL da Foto (Avatar)</label>
                        <input type="url" class="form-control" id="myProfileAvatarInput" placeholder="https://...">
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Nova Senha (opcional)</label>
                        <input type="password" class="form-control" id="myProfilePasswordInput" minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="myProfilePasswordConfirmInput">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn-secondary" onclick="window.UI.closeModal('myProfileModal')" style="background: var(--bg-secondary);">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/core/firebase-init.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/audit.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/modules/transactions.js"></script>
</body>
</html>
